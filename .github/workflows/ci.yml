name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node test/smoke.mjs
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((f) => !/^(dist\/|README\.md$|llms\.txt$|LICENSE$|CHANGELOG\.md$|package\.json$)/.test(f));
            if (bad.length) { console.error("unexpected files:", bad); process.exit(1); }
          '

  bun:
    name: Bun smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: bun test/smoke.mjs
